spring.application.name=brew-backend

# Secrets come from environment variables (Railway service variables in prod).
# Locally, put them in brew-backend/.env (gitignored), loaded below.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Let Hibernate auto-detect PG
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Supabase JWT secret
supabase.jwt.secret=${SUPABASE_JWT_SECRET:}
supabase.url=${SUPABASE_URL}

# Let Railway set the port dynamically
server.port=${PORT:8080}
